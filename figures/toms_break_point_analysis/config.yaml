# Breakpoint analysis layered on the canonical synthetic experiment in
# code/experiments/toy/config.yaml.  The seed and generated prediction paths
# are inherited from that file.
observation_times: [20, 50, 100, 200, 400]
production:
  x_tolerance: 1.0e-4
  y_tolerance: 1.0e-6
  max_steps: 80
reference:
  x_tolerance: 1.0e-12
  y_tolerance: 1.0e-10
  max_steps: 200
representative_call_count: 6
